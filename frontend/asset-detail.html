<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asset · Trasset</title>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Lexend:wght@300;400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">

  <style>
    /* Timeline used by the History tab */
    .timeline { position: relative; padding-left: 30px; }
    .timeline::before {
      content: ''; position: absolute; left: 9px; top: 6px; bottom: 6px;
      width: 2px; background: var(--border);
    }
    .timeline-item { position: relative; padding-bottom: var(--space-5); }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-dot {
      position: absolute; left: -30px; top: 2px;
      width: 20px; height: 20px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--color-surface); border: 2px solid var(--border);
      color: var(--color-muted);
    }
    .timeline-dot.is-out { border-color: var(--color-ink); color: var(--color-ink); }
    .timeline-dot.is-in  { border-color: var(--color-primary); color: var(--color-primary); }
    .timeline-title { font-weight: 500; }
    .timeline-meta  { font-size: var(--fs-small); color: var(--color-muted); margin-top: 2px; }
    .timeline-note  {
      margin-top: var(--space-2); padding: var(--space-2) var(--space-3);
      background: var(--color-bg); border-radius: var(--radius-sm);
      font-size: var(--fs-small);
    }

    .spec-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: var(--space-4); }
    .spec-label {
      font-size: var(--fs-tiny); font-weight: 600; letter-spacing: .05em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 3px;
    }
    .spec-value { font-size: var(--fs-body); }

    .qr-box { text-align: center; }
    .qr-box img {
      width: 168px; height: 168px; padding: var(--space-2);
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
    }

    /* Documents */
    .doc-row {
      display: flex; align-items: center; gap: var(--space-3);
      padding: var(--space-3);
      border: 1px solid var(--border); border-radius: var(--radius);
      margin-bottom: var(--space-2);
      transition: border-color var(--dur-fast) var(--ease);
    }
    .doc-row:last-child { margin-bottom: 0; }
    .doc-row:hover { border-color: var(--border-strong); }
    .doc-icon {
      width: 38px; height: 38px; flex-shrink: 0;
      display: grid; place-items: center; border-radius: var(--radius-sm);
      background: var(--ink-soft); color: var(--ink-light);
    }
    .doc-info { flex: 1; min-width: 0; }
    .doc-name {
      font-weight: 500; display: block;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .doc-meta { font-size: var(--fs-small); color: var(--color-muted); }

    /* A drop target reads as one; a plain button does not. */
    .dropzone {
      border: 2px dashed var(--border-strong); border-radius: var(--radius);
      padding: var(--space-6) var(--space-4); text-align: center;
      color: var(--color-muted); cursor: pointer;
      transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    .dropzone:hover, .dropzone.is-over {
      border-color: var(--color-primary); background: var(--primary-soft);
      color: var(--primary-darker);
    }

    @media print {
      .tabs, .card-header, .breadcrumb { display: none !important; }
    }
  </style>
</head>
<body>

<div class="boot" id="boot">
  <div class="boot-inner">
    <div class="spinner-lg"></div>
    <p class="text-muted text-small">Loading asset…</p>
  </div>
</div>

<a href="#main" class="skip-link">Skip to content</a>

<div class="app" id="app">
  <main class="main">
    <div class="content" id="main">

      <div class="breadcrumb">
        <a href="dashboard.html">Dashboard</a>
        <span>/</span>
        <a href="assets.html">Assets</a>
        <span>/</span>
        <span id="crumbTag">…</span>
      </div>

      <div class="page-header">
        <div>
          <h1 class="page-title" id="assetName">…</h1>
          <p class="page-subtitle">
            <span class="mono-tag" id="assetTag"></span>
            <span id="assetStatus"></span>
          </p>
        </div>
        <div class="page-actions" id="assetActions"></div>
      </div>

      <div class="grid-2-1 mb-4">
        <div class="stack">

          <!-- Overview -->
          <div class="card">
            <div class="card-header"><h3>Overview</h3></div>
            <div class="card-body">
              <div class="spec-list" id="overviewSpecs"></div>
            </div>
          </div>

          <!-- Tabs -->
          <div class="card">
            <div class="tabs" role="tablist">
              <button class="tab is-active" data-tab="history" role="tab"
                      aria-selected="true" aria-controls="tabHistory">History</button>
              <button class="tab" data-tab="specs" role="tab"
                      aria-selected="false" aria-controls="tabSpecs">Specifications</button>
              <button class="tab" data-tab="documents" role="tab"
                      aria-selected="false" aria-controls="tabDocuments">
                Documents <span id="docCount"></span>
              </button>
              <button class="tab" data-tab="depreciation" role="tab"
                      aria-selected="false" aria-controls="tabDepreciation">Depreciation</button>
            </div>

            <div class="card-body" id="tabHistory">
              <div id="historyContent"></div>
            </div>

            <div class="card-body hidden" id="tabSpecs">
              <div id="specsContent"></div>
            </div>

            <div class="card-body hidden" id="tabDocuments">
              <div class="flex justify-between items-center mb-4" id="documentsToolbar">
                <p class="text-muted text-small" style="margin:0">
                  Invoices, warranty certificates and photographs.
                </p>
                <button class="btn btn-secondary btn-sm" id="uploadDocBtn">
                  <span class="btn-label">Upload</span>
                </button>
              </div>
              <div id="documentsContent"></div>
            </div>

            <div class="card-body hidden" id="tabDepreciation">
              <div class="chart-box mb-4"><canvas id="depChart"></canvas></div>
              <div class="table-wrap">
                <table class="table">
                  <thead>
                    <tr>
                      <th>Year</th>
                      <th style="text-align:right">Opening</th>
                      <th style="text-align:right">Depreciation</th>
                      <th style="text-align:right">Closing</th>
                    </tr>
                  </thead>
                  <tbody id="depBody"></tbody>
                </table>
              </div>
            </div>
          </div>

        </div>

        <div class="stack">

          <!-- Valuation -->
          <div class="card">
            <div class="card-header"><h3>Valuation</h3></div>
            <div class="card-body" id="valuationBox"></div>
          </div>

          <!-- Assignment -->
          <div class="card">
            <div class="card-header"><h3>Assignment</h3></div>
            <div class="card-body" id="assignmentBox"></div>
          </div>

          <!-- QR -->
          <div class="card">
            <div class="card-header">
              <div>
                <h3>Label</h3>
                <div class="card-subtitle">Scan to open this asset</div>
              </div>
            </div>
            <div class="card-body qr-box" id="qrBox"></div>
          </div>

        </div>
      </div>

    </div>
  </main>
</div>

<script src="js/vendor/jquery.min.js"></script>
<script src="js/vendor/chart.umd.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/shell.js"></script>
<script src="js/charts.js"></script>
<script src="js/asset-form.js"></script>
<script src="js/asset-detail.js"></script>
</body>
</html>
